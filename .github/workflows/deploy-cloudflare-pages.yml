name: Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web
        run: flutter build web --release --pwa-strategy=none

      - name: Validate Cloudflare configuration
        env:
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PROJECT_NAME || vars.CLOUDFLARE_PROJECT_NAME }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CF_PROJECT" ]; then
            echo "::error::CLOUDFLARE_PROJECT_NAME is empty or not set."
            echo "Add it under Settings → Secrets and variables → Actions:"
            echo "  - Secrets (recommended): CLOUDFLARE_PROJECT_NAME"
            echo "  - or Variables: CLOUDFLARE_PROJECT_NAME"
            echo "Example value: smart-expense (must match your Cloudflare Pages project name)"
            missing=1
          fi
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is not set."
            missing=1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Cloudflare project: $CF_PROJECT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || vars.CLOUDFLARE_PROJECT_NAME }}
