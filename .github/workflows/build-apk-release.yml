name: Build Android Release APK

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run flutter analyze and flutter test before building"
        required: true
        type: boolean
        default: true
      build_number:
        description: "Optional Android build number override"
        required: false
        type: string

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        if: ${{ inputs.run_tests }}
        run: flutter analyze

      - name: Test
        if: ${{ inputs.run_tests }}
        run: flutter test

      - name: Build APK release
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            flutter build apk --release --build-number="${{ inputs.build_number }}"
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-expense-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
