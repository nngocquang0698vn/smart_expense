name: smart_expense
description: Smart Ledger — quản lý tài chính cá nhân, offline (Web & Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  fl_chart: ^1.1.1
  go_router: ^17.0.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sembast: ^3.8.5
  sembast_web: ^2.4.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.5
  record: ^6.2.0
  just_audio: ^0.10.5
  flutter_local_notifications: ^21.0.0
  http: ^1.6.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/app_icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/seed/audio/
    - assets/seed/images/
